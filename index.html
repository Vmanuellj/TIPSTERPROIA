      panel.innerHTML=
        '<div class="sh"><div class="sh-ico" style="background:var(--pud);color:var(--pu)">'+useIco('ico-chart')+'</div><div class="sh-title">STATS</div><div class="sh-line"></div><div class="sh-ct">'+g.n+' PICKS</div></div>'+
        '<div class="lrn-hero">'+
          '<div class="lrn-roi '+rs+'"><div class="lrn-roi-v">'+(g.roi>0?'+':'')+g.roi+'%</div><div class="lrn-roi-l">ROI acumulado · actualiza a diario</div></div>'+
          '<div class="lrn-mini"><div class="lrn-mini-v" style="color:var(--gr)">'+g.win_pct+'%</div><div class="lrn-mini-l">Acierto</div></div>'+
          '<div class="lrn-mini"><div class="lrn-mini-v" style="color:var(--tx)">'+g.wins+'-'+g.losses+'</div><div class="lrn-mini-l">Récord</div></div>'+
        '</div>'+
        '<div class="lrn-sports">'+sportRows+'</div>'+
        calibNote;
    })
    .catch(function(){/* sin summary aún — silencioso */});
}

// ─── DAY NAVIGATION ──────────────────────────────────────────────────────────
var DAY_OFFSET=0; // 0=hoy, -1=ayer, -2=antes de ayer...

function dateFromOffset(offset){
  var d=new Date();
  d.setDate(d.getDate()+offset);
  return d;
}
function dateStrFromOffset(offset){
  var d=dateFromOffset(offset);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function updateDayNav(){
  var d=dateFromOffset(DAY_OFFSET);
  var dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var label=dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
  var lbl=document.getElementById('dayNavLabel');
  if(lbl)lbl.textContent=label;
  // botón siguiente desactivado si ya estamos en hoy
  var btnNext=document.getElementById('btnNextDay');
  if(btnNext)btnNext.disabled=(DAY_OFFSET>=0);
  // botón previo desactivado si llevamos 30 días atrás
  var btnPrev=document.getElementById('btnPrevDay');
  if(btnPrev)btnPrev.disabled=(DAY_OFFSET<=-30);
}
function shiftDay(delta){
  var newOffset=DAY_OFFSET+delta;
  if(newOffset>0||newOffset<-30)return;
  DAY_OFFSET=newOffset;
  loadDay();
}
function goToday(){
  if(DAY_OFFSET===0)return;
  DAY_OFFSET=0;
  loadDay();
}
function showLoading(msg){
  var ls=document.getElementById('loadScreen');
  var app=document.getElementById('app');
  if(ls){ls.style.display='flex';ls.innerHTML='<div class="spin"></div><div class="load-txt">'+(msg||'CARGANDO PICKS...')+'</div>';}
  if(app)app.style.display='none';
}
function loadDay(){
  updateDayNav();
  showLoading('CARGANDO PICKS...');
  switchTab('inicio');
  var ds=dateStrFromOffset(DAY_OFFSET);
  if(DAY_OFFSET===0){
    tryFetch('/latest.json','/picks-'+ds+'.json');
  } else {
    tryFetch('/picks-'+ds+'.json',null);
  }
}

// ─── FETCH ────────────────────────────────────────────────────────────────────
function tryFetch(url,fb){
  var ctrl=new AbortController(),tmo=setTimeout(function(){ctrl.abort();},9000);
  fetch(url,{signal:ctrl.signal})
    .then(function(r){clearTimeout(tmo);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){render(d);loadResults(dateStrFromOffset(DAY_OFFSET));loadLearning();})
    .catch(function(err){
      if(fb){tryFetch(fb,null);}
      else{
        var ls=document.getElementById('loadScreen');
        var ds=dateStrFromOffset(DAY_OFFSET);
        if(ls)ls.innerHTML='<div style="text-align:center;padding:40px;max-width:300px"><div style="font-size:36px;margin-bottom:12px">📅</div><div style="font-family:var(--hf);font-size:17px;font-weight:800;margin-bottom:8px;color:var(--tx)">SIN PICKS</div><div style="font-size:12px;color:var(--tx3);margin-bottom:16px">No hay picks registrados para el <b style="color:var(--tx2)">'+ds+'</b></div><button onclick="shiftDay(0)" style="font-family:var(--hf);font-size:12px;font-weight:700;padding:9px 20px;border-radius:8px;border:1px solid var(--pub);background:var(--pud);color:var(--pu);cursor:pointer;margin-right:8px">REINTENTAR</button><button onclick="goToday()" style="font-family:var(--hf);font-size:12px;font-weight:700;padding:9px 20px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx2);cursor:pointer">IR A HOY</button></div>';
      }
    });
}

// ─── SWIPE ENTRE DEPORTES ──────────────────────────────────────────────────
(function(){
  var TAB_ORDER=['inicio','mlb','nba','futbol','nfl','resumen'];
  var startX=0,startY=0,tracking=false;
  var target=document.getElementById('app');
  target.addEventListener('touchstart',function(e){
    var t=e.touches[0];startX=t.clientX;startY=t.clientY;tracking=true;
  },{passive:true});
  target.addEventListener('touchend',function(e){
    if(!tracking)return;tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-startX,dy=t.clientY-startY;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.3)return;
    var cur=document.querySelector('.tab-btn.active');
    var curId=cur?cur.dataset.tab:'inicio';
    var idx=TAB_ORDER.indexOf(curId);
    if(idx<0)return;
    var next=dx<0?idx+1:idx-1;
    if(next<0||next>=TAB_ORDER.length)return;
    switchTab(TAB_ORDER[next]);
  },{passive:true});
})();
</script>
</body>
</html>
