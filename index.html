<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SPORTWISE</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08061a;--bg2:#0f0b26;--bg3:#15102e;--bg4:#1c1640;
  --sf:rgba(139,92,246,.04);--sf2:rgba(139,92,246,.07);--sf3:rgba(139,92,246,.12);
  --bd:rgba(139,92,246,.12);--bd2:rgba(139,92,246,.22);--bd3:rgba(139,92,246,.35);
  --tx:#eef2ff;--tx2:#a8b2d8;--tx3:#4a4270;--tx4:#2e2850;
  --cy:#00e5b4;--cy2:#00b894;--cyd:rgba(0,229,180,.10);--cyb:rgba(0,229,180,.28);--cys:rgba(0,229,180,.05);
  --pu:#a78bfa;--pu2:#8b5cf6;--pud:rgba(139,92,246,.15);--pub:rgba(139,92,246,.38);--pus:rgba(139,92,246,.07);
  --am:#f59e0b;--amd:rgba(245,158,11,.12);--amb:rgba(245,158,11,.3);
  --bl:#60a5fa;--bld:rgba(96,165,250,.12);--blb:rgba(96,165,250,.28);
  --re:#f87171;--red:rgba(248,113,113,.12);--reb:rgba(248,113,113,.3);
  --gr:#10b981;--grd:rgba(16,185,129,.12);--grb:rgba(16,185,129,.3);
  --nfl:#ff6b35;--nfld:rgba(255,107,53,.12);--nflb:rgba(255,107,53,.3);
  --tn:#a3e635;--tnd:rgba(163,230,53,.12);--tnb:rgba(163,230,53,.3);
  --rd:16px;--rds:10px;--rdxs:6px;
  --hf:'Barlow Condensed',sans-serif;
  --bf:'Barlow',sans-serif;
  --shadow-card:0 4px 28px rgba(0,0,0,.55);
  --shadow-glow-cy:0 0 32px rgba(0,229,180,.12);
  --shadow-glow-pu:0 0 36px rgba(139,92,246,.22);
  --shadow-glow-am:0 0 32px rgba(245,158,11,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--tx);font-family:var(--bf);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}

/* ─── ORBS ──────────────────────────────────────── */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.14;animation:drift 18s ease-in-out infinite alternate;}
.ob1{width:600px;height:600px;background:#6d28d9;top:-200px;left:-140px;}
.ob2{width:480px;height:480px;background:#4c1d95;top:25%;right:-120px;animation-delay:-7s;}
.ob3{width:360px;height:360px;background:#312e81;bottom:5%;left:8%;animation-delay:-13s;}
.ob4{width:280px;height:280px;background:#7c3aed;bottom:-60px;right:6%;animation-delay:-4s;}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(28px,20px) scale(1.08)}}

/* ─── TOPBAR ─────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:200;background:linear-gradient(180deg,rgba(13,9,32,.96) 0%,rgba(8,6,26,.92) 100%);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid rgba(139,92,246,.18);box-shadow:0 1px 40px rgba(109,40,217,.12);}
.tb-inner{max-width:920px;margin:0 auto;padding:0 18px;}
.tb-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 0 9px;}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--hf);font-size:27px;font-weight:900;letter-spacing:-.3px;}
.logo-circle{width:32px;height:32px;border-radius:50%;background:#0a0720;border:2px solid #8b5cf6;box-shadow:0 0 10px #8b5cf699,0 0 22px #8b5cf633,inset 0 0 8px #8b5cf618;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-wm{display:inline-flex;align-items:baseline;text-transform:uppercase;letter-spacing:.5px;}
.logo-t{color:#a78bfa;text-shadow:0 0 14px #8b5cf688;}
.logo-p{color:#eef2ff;}
.logo-img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex-shrink:0;border:1px solid rgba(139,92,246,.35);box-shadow:0 0 14px rgba(139,92,246,.35),0 0 6px rgba(96,165,250,.35);}
@media(max-width:430px){.logo{font-size:23px;gap:9px;}.logo-img{width:40px;height:40px;}}
.tb-right{display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--pud);border:1px solid var(--pub);color:var(--pu);font-family:var(--hf);font-size:9px;font-weight:800;letter-spacing:1.5px;padding:4px 10px;border-radius:99px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--pu);animation:blink 1.6s ease-in-out infinite;}
.hdr-date .hdr-d2 span{color:var(--pu);font-weight:700;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.hdr-date .hdr-d1{font-family:var(--hf);font-size:12px;font-weight:700;color:var(--tx);text-align:right;}
.hdr-date .hdr-d2{font-size:10px;color:var(--tx3);text-align:right;margin-top:1px;}
.hdr-date .hdr-d2 span{color:var(--bl);font-weight:700;}

/* ─── TABS ───────────────────────────────────────── */
.nav-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:0;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tabs{padding:4px 0 6px;}
.tab-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;font-family:var(--hf);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;border:none;cursor:pointer;transition:all .2s;color:var(--tx3);background:transparent;border-radius:99px;position:relative;}
.tab-btn:hover{color:var(--tx2);background:rgba(139,92,246,.06);}
.tab-btn.active{color:#fff;background:linear-gradient(135deg,#7c3aed,#a78bfa);box-shadow:0 2px 16px rgba(139,92,246,.35);}
.tab-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.tab-btn.active svg{opacity:1;}
.tab-ct{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:15px;border-radius:99px;font-size:9px;font-weight:800;padding:0 4px;background:var(--pud);border:1px solid var(--pub);color:var(--pu);}
.tab-ct.zero{background:var(--sf);border-color:var(--bd);color:var(--tx4);}
.tab-btn.active .tab-ct{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff;}

/* ─── MAIN ───────────────────────────────────────── */
.main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:22px 18px 70px;}
.section{display:none;animation:fadeUp .3s ease both;}
.section.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ─── SECTION HEADER ─────────────────────────────── */
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 14px;}
.sh-ico{width:30px;height:30px;border-radius:var(--rds);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sh-ico svg{width:16px;height:16px;}
.sh-title{font-family:var(--hf);font-size:18px;font-weight:800;letter-spacing:-.2px;}
.sh-line{flex:1;height:1px;background:var(--bd);}
.sh-ct{font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);}

/* ─── DATE HERO ──────────────────────────────────── */
.date-hero{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.dh-eyebrow{font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.dh-eyebrow::after{content:'';flex:1;height:1px;background:var(--bd);}
.dh-title{font-family:var(--hf);font-size:48px;font-weight:900;line-height:.9;letter-spacing:-1.5px;}
.dh-grad{background:linear-gradient(105deg,#00e5b4,#60a5fa 55%,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dh-sub{font-family:var(--hf);font-size:10px;letter-spacing:2.5px;color:var(--tx3);text-transform:uppercase;margin-top:8px;}
.dh-sub b{color:var(--tx2);}
.dh-stats{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.dst{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rd);padding:12px 16px;text-align:center;min-width:76px;}
.dst-v{font-family:var(--hf);font-size:28px;font-weight:900;line-height:1;}
.dst-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:3px;font-weight:600;}
/* NUEVO HERO REPORT */
.hero-report{border-radius:var(--rd);border:1px solid var(--bd);background:var(--sf);overflow:hidden;margin-bottom:22px;}
.hr-top{background:linear-gradient(90deg,rgba(0,229,180,.1),rgba(96,165,250,.06),transparent);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.hr-brand{display:flex;align-items:center;gap:10px;}
.hr-brand-ico{width:36px;height:36px;border-radius:var(--rds);background:var(--cyd);border:1px solid var(--cyb);display:flex;align-items:center;justify-content:center;}
.hr-brand-txt{}
.hr-brand-name{font-family:var(--hf);font-size:16px;font-weight:900;letter-spacing:-.3px;background:linear-gradient(105deg,#00e5b4,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hr-brand-sub{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);margin-top:1px;}
.hr-date{text-align:right;}
.hr-date-main{font-family:var(--hf);font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--tx);}
.hr-date-sub{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-top:2px;}
.hr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;}
.hrs{padding:14px 8px;text-align:center;border-right:1px solid var(--bd);position:relative;}
.hrs:last-child{border-right:none;}
.hrs-v{font-family:var(--hf);font-size:30px;font-weight:900;line-height:1;}
.hrs-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:3px;font-weight:600;}
.hrs-bar{position:absolute;bottom:0;left:10%;right:10%;height:2px;border-radius:99px;}
.hr-sports{padding:10px 20px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sport-tag{font-family:var(--hf);font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid;}
.st-mlb{color:var(--cy);background:var(--cyd);border-color:var(--cyb);}
.st-nba{color:var(--am);background:var(--amd);border-color:var(--amb);}
.st-futbol{color:var(--gr);background:var(--grd);border-color:var(--grb);}
.st-nfl{color:var(--nfl);background:var(--nfld);border-color:var(--nflb);}
.st-tennis{color:#a3e635;background:rgba(163,230,53,.12);border-color:rgba(163,230,53,.3);}
.hr-method{margin-left:auto;font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);}
@media(max-width:500px){.hr-stats{grid-template-columns:repeat(2,1fr);}.hrs:nth-child(2){border-right:none;}.hrs:nth-child(3){border-top:1px solid var(--bd)}}

/* ─── NEWS BAR ───────────────────────────────────── */
.news-bar{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 14px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.news-tag{font-family:var(--hf);font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--pu);background:var(--pud);border:1px solid var(--pub);padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.news-txt{font-size:11px;color:var(--tx2);line-height:1.5;}

/* ─── MINI MENÚ DE DEPORTES ──────────────────────── */
.sport-menu{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
.sm-item{flex:1 1 120px;}
.sm-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rd);padding:14px 8px;cursor:pointer;transition:border-color .2s,transform .15s;}
.sm-item:hover{transform:translateY(-2px);border-color:var(--bd2);}
.sm-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.sm-label{font-family:var(--hf);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);}
.sm-count{font-size:9px;color:var(--tx3);}
@media(max-width:500px){.sport-menu{grid-template-columns:repeat(2,1fr);}}

/* ─── TEAM LOGO ──────────────────────────────────── */
.t-logo{display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;}
.t-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.t-logo .t-init{font-family:var(--hf);font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;letter-spacing:1px;}
.t-flag{font-size:1em;line-height:1;}

/* ─── GOLD PICK CARD ─────────────────────────────── */
.gold-card{position:relative;border-radius:var(--rd);border:1px solid var(--pub);background:linear-gradient(140deg,rgba(139,92,246,.1) 0%,var(--bg2) 55%);box-shadow:var(--shadow-glow-pu),var(--shadow-card),inset 0 1px 0 rgba(167,139,250,.26);overflow:hidden;margin-bottom:20px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);transition:box-shadow .25s;}
.gold-card:hover{box-shadow:0 0 56px rgba(139,92,246,.28),var(--shadow-card);}
.gold-topbar{height:3px;background:linear-gradient(90deg,#7c3aed,#a78bfa,#60a5fa);box-shadow:0 0 14px #8b5cf6;}
.gold-badge{position:absolute;top:16px;right:16px;font-family:var(--hf);font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--pub);color:var(--pu);padding:4px 12px;border-radius:99px;background:var(--pud);}
.gc-inner{padding:20px 22px;}
.gc-ctx{font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);margin-bottom:14px;}
.gc-matchup{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.gc-team{display:flex;align-items:center;gap:10px;}
.gc-tname{font-family:var(--hf);font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1;}
.gc-tname.away{color:var(--tx2);}
.gc-tname.home{color:var(--tx);}
.gc-vs{font-family:var(--hf);font-size:13px;font-weight:700;color:var(--tx4);flex-shrink:0;padding:0 4px;}
.gc-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.badge-pick{font-family:var(--hf);font-size:14px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;background:linear-gradient(135deg,#6d28d9,#7c3aed,#a78bfa);border:none;color:#fff;padding:8px 22px;border-radius:99px;box-shadow:0 0 24px rgba(139,92,246,.55),0 2px 10px rgba(0,0,0,.4);cursor:default;position:relative;overflow:hidden;}
.badge-pick::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%);border-radius:99px;}
.badge-ev{font-family:var(--hf);font-size:14px;font-weight:900;background:var(--grd);border:1px solid var(--grb);color:var(--gr);padding:6px 16px;border-radius:var(--rds);box-shadow:0 0 14px rgba(16,185,129,.18);}
.badge-ev.high{background:rgba(16,185,129,.2);border-color:var(--gr);box-shadow:0 0 22px rgba(16,185,129,.3);}
.badge-tipo{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--bld);border:1px solid var(--blb);color:var(--bl);padding:4px 11px;border-radius:99px;}
.badge-cuota{font-family:var(--hf);font-size:12px;font-weight:700;color:var(--pu);border:1px solid var(--pub);padding:4px 11px;border-radius:99px;background:var(--pud);}
.badge-verified{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--gr);background:var(--grd);border:1px solid var(--grb);padding:3px 8px;border-radius:99px;}
.badge-estimated{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--am);background:var(--amd);border:1px solid var(--amb);padding:3px 8px;border-radius:99px;}
/* ─── RESULTADO BADGES ───────────────────────────── */
.res-win{display:inline-flex;align-items:center;gap:5px;font-family:var(--hf);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#059669,#10b981);border:1px solid #10b981;padding:4px 12px;border-radius:99px;box-shadow:0 0 14px rgba(16,185,129,.35);}
.res-loss{display:inline-flex;align-items:center;gap:5px;font-family:var(--hf);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#dc2626,#f87171);border:1px solid #f87171;padding:4px 12px;border-radius:99px;box-shadow:0 0 14px rgba(248,113,113,.3);}
.res-push{display:inline-flex;align-items:center;gap:5px;font-family:var(--hf);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd2);padding:4px 12px;border-radius:99px;}
.res-pending{display:inline-flex;align-items:center;gap:5px;font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);background:var(--sf);border:1px solid var(--bd);padding:4px 12px;border-radius:99px;}
.res-score{font-size:9px;font-weight:600;opacity:.75;}
.day-results-bar{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rd);padding:12px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.drb-stat{display:flex;flex-direction:column;align-items:center;min-width:44px;}
.drb-v{font-family:var(--hf);font-size:22px;font-weight:900;line-height:1;}
.drb-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:2px;}
.drb-div{width:1px;height:32px;background:var(--bd);}
.drb-roi{font-family:var(--hf);font-size:13px;font-weight:800;margin-left:auto;}
.drb-roi.pos{color:var(--gr);}
.drb-roi.neg{color:var(--re);}
.drb-roi.neu{color:var(--tx3);}
.gc-analysis{background:rgba(255,255,255,.025);border:1px solid var(--bd);border-left:3px solid var(--cyb);border-radius:0 var(--rds) var(--rds) 0;padding:11px 14px;margin-bottom:16px;font-size:12px;line-height:1.65;color:var(--tx2);max-height:80px;overflow:hidden;position:relative;transition:max-height .4s cubic-bezier(.22,1,.36,1),padding .3s;}
.gc-analysis.expanded{max-height:500px;}
.gc-analysis-fade{position:absolute;bottom:0;left:0;right:0;height:32px;background:linear-gradient(transparent,rgba(18,12,40,.85));display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;cursor:pointer;transition:opacity .3s;}
.gc-analysis.expanded .gc-analysis-fade{display:none;}
.gc-toggle{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pu);background:var(--pud);border:1px solid var(--pub);padding:3px 12px;border-radius:99px;cursor:pointer;margin-top:6px;display:inline-block;}
@keyframes gc-pulse{0%,100%{box-shadow:var(--shadow-glow-pu),var(--shadow-card);}50%{box-shadow:0 0 40px rgba(139,92,246,.32),var(--shadow-card);}}
.gold-card{animation:gc-pulse 4s ease-in-out infinite;}
.prob-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.prob-lbl{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);}
.prob-pct{font-family:var(--hf);font-size:24px;font-weight:900;color:var(--pu);}
.prob-bar{height:5px;background:var(--sf2);border-radius:99px;overflow:hidden;}
.prob-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:99px;transition:width 1.1s cubic-bezier(.22,1,.36,1);width:0;}
.gc-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);}
.stars{display:flex;gap:3px;}
.star{font-size:15px;}
.star-on-pu{color:var(--pu);filter:drop-shadow(0 0 5px rgba(139,92,246,.6));}
.star-on-cy{color:var(--cy);filter:drop-shadow(0 0 5px rgba(0,229,180,.55));}
.star-on-am{color:var(--am);filter:drop-shadow(0 0 4px rgba(245,158,11,.5));}
.star-on-gray{color:var(--tx2);}
.star-off{color:rgba(255,255,255,.08);}
.stake-pill{font-family:var(--hf);font-size:11px;font-weight:700;letter-spacing:.8px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx2);padding:5px 14px;border-radius:99px;}
/* ─── CUOTA MÍNIMA CON VALOR (anclada al mercado sharp Pinnacle) ─── */
.value-box{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(0,229,180,.08),rgba(96,165,250,.05));border:1px solid var(--cyb);border-radius:var(--rds);padding:12px 16px;margin:14px 0;}
.vb-item{display:flex;flex-direction:column;gap:2px;}
.vb-l{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);}
.vb-v{font-family:var(--hf);font-size:20px;font-weight:900;line-height:1;color:var(--tx);}
.vb-v.vb-strong{font-size:26px;color:var(--cy);text-shadow:0 0 12px rgba(0,229,180,.4);}
.vb-note{flex:1;min-width:160px;font-size:10.5px;color:var(--tx2);line-height:1.5;}
.vb-note b{color:var(--cy);}
.cuotas{display:flex;gap:10px;align-items:center;}
.cq{font-family:var(--hf);font-size:11px;font-weight:700;color:var(--tx3);}
.cq span{color:var(--tx2);}

/* ─── PICK CARDS GRID ────────────────────────────── */
.picks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px;margin-bottom:20px;}
.pick-card{position:relative;border-radius:var(--rd);border:1px solid var(--bd2);background:var(--sf2);overflow:hidden;cursor:pointer;contain:paint;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(167,139,250,.26);transition:transform .18s,border-color .22s,box-shadow .22s;}
.pick-card:hover{transform:translateY(-3px);}
.pick-card.s5{border-color:var(--pub);box-shadow:var(--shadow-glow-pu),0 2px 12px rgba(0,0,0,.35);}
.pick-card.s5:hover{box-shadow:0 0 44px rgba(139,92,246,.3),0 4px 24px rgba(0,0,0,.5);}
.pick-card.s4{border-color:var(--cyb);box-shadow:var(--shadow-glow-cy),0 2px 12px rgba(0,0,0,.3);}
.pick-card.s4:hover{box-shadow:0 0 40px rgba(0,229,180,.25),0 4px 20px rgba(0,0,0,.45);}
.pick-card.s3{border-color:var(--amb);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.pick-card.s3:hover{box-shadow:var(--shadow-glow-am),0 4px 20px rgba(0,0,0,.45);}
.pick-card.s1:hover,.pick-card.s2:hover{box-shadow:0 4px 20px rgba(0,0,0,.4);}
.pc-stripe{height:3px;}
.pc-s5{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.pc-s4{background:linear-gradient(90deg,#00b894,#00e5b4);}
.pc-s3{background:linear-gradient(90deg,#f59e0b,#ef4444);}
.pc-s1,.pc-s2{background:var(--bg4);}
.pc-inner{padding:14px 15px;}
.pc-ctx{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;}
.pc-teams{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.pc-vs{font-family:var(--hf);font-size:10px;color:var(--tx4);flex-shrink:0;}
.pc-name{font-family:var(--hf);font-size:18px;font-weight:800;letter-spacing:-.3px;text-transform:uppercase;line-height:1.1;}
.pc-mid{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px;}
.pc-pick{font-family:var(--hf);font-size:11.5px;font-weight:800;text-transform:uppercase;color:var(--pu);letter-spacing:.2px;background:var(--pud);border:1px solid var(--pub);padding:5px 11px;border-radius:var(--rds);line-height:1.25;flex:1;min-width:0;}
.pc-ev{font-family:var(--hf);font-size:14px;font-weight:900;color:var(--gr);}
.pc-cuota{font-family:var(--hf);font-size:12px;font-weight:800;color:var(--pu);background:var(--pud);border:1px solid var(--pub);padding:3px 9px;border-radius:var(--rdxs);}
.pc-pbar{height:3px;background:var(--sf2);border-radius:99px;overflow:hidden;margin-bottom:9px;}
.pc-pfill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:99px;transition:width 1s cubic-bezier(.22,1,.36,1);width:0;}
.pc-reason{font-size:11px;color:var(--tx3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--bd);}
.pc-stars{display:flex;gap:2px;}
.pc-star{font-size:11px;}
.pc-tipo{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--bl);background:var(--bld);border:1px solid var(--blb);padding:2px 8px;border-radius:99px;}
.pc-stake{font-family:var(--hf);font-size:10px;font-weight:700;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd);padding:2px 8px;border-radius:99px;}
.pc-detail{display:none;background:var(--bg3);border-top:1px solid var(--bd);padding:12px 15px;}
.pc-detail.open{display:block;}
.pd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px;}
.pd-cell{background:var(--bg4);border:1px solid var(--bd);border-radius:var(--rdxs);padding:8px 6px;text-align:center;}
.pd-v{font-family:var(--hf);font-size:15px;font-weight:800;}
.pd-l{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin-top:2px;}
.pd-txt{font-size:11px;color:var(--tx2);line-height:1.6;}

/* ─── PARLAY ─────────────────────────────────────── */
.parlay-card{border-radius:var(--rd);border:1px solid var(--pub);background:linear-gradient(135deg,rgba(167,139,250,.07),var(--bg2));box-shadow:var(--shadow-glow-pu),var(--shadow-card);overflow:hidden;margin-bottom:20px;}
.parlay-head{background:linear-gradient(90deg,rgba(167,139,250,.12),transparent);border-bottom:1px solid var(--pub);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.parlay-title{font-family:var(--hf);font-size:17px;font-weight:900;color:var(--pu);letter-spacing:.2px;}
.parlay-sub{font-family:var(--hf);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-top:3px;}
.parlay-big{font-family:var(--hf);font-size:38px;font-weight:900;color:var(--pu);line-height:1;}
.parlay-big-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:2px;}
.parlay-body{padding:16px 20px;}
.pl-legs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.pl-leg{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 14px;}
.pl-num{font-family:var(--hf);font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--pu);background:var(--pud);border:1px solid var(--pub);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pl-txt{font-family:var(--hf);font-size:13px;font-weight:700;flex:1;text-transform:uppercase;}
.pl-cuota{font-family:var(--hf);font-size:13px;font-weight:800;color:var(--pu);}
.pl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pls{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 8px;text-align:center;}
.pls-v{font-family:var(--hf);font-size:20px;font-weight:900;}
.pls-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);margin-top:3px;}
.parlay-note{font-size:11px;color:var(--tx3);line-height:1.65;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);}

/* ─── BANKROLL CALC ──────────────────────────────── */
.calc-card{position:relative;background:var(--sf2);border:1px solid var(--bd2);border-radius:var(--rd);padding:18px 20px;margin-bottom:20px;overflow:hidden;contain:paint;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(167,139,250,.26);}
.calc-title{font-family:var(--hf);font-size:15px;font-weight:800;letter-spacing:.2px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.calc-icon{width:26px;height:26px;border-radius:var(--rdxs);background:var(--amd);border:1px solid var(--amb);display:flex;align-items:center;justify-content:center;}
.calc-icon svg{width:14px;height:14px;color:var(--am);}
.calc-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.calc-lbl{font-family:var(--hf);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);}
.calc-curr{font-family:var(--hf);font-size:14px;font-weight:700;color:var(--tx2);}
.calc-input{background:var(--bg3);border:1px solid var(--bd2);border-radius:var(--rds);color:var(--tx);font-family:var(--hf);font-size:22px;font-weight:800;padding:8px 14px;width:170px;outline:none;transition:border-color .15s;}
.calc-input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,180,.08);}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.ci{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 12px;}
.ci-pick{font-family:var(--hf);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx2);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-amt{font-family:var(--hf);font-size:22px;font-weight:900;color:var(--cy);line-height:1;}
.ci-pct{font-size:10px;color:var(--tx3);margin-top:1px;}

/* ─── EXEC TABLE ─────────────────────────────────── */
.exec-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px;}
.exec-table th{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;}
.exec-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.exec-table tr:hover td{background:var(--sf);}
.et-pick{font-family:var(--hf);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;}
.et-match{font-size:10px;color:var(--tx3);margin-top:1px;font-family:var(--hf);font-weight:700;letter-spacing:.5px;}
.et-tipo{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--bl);background:var(--bld);border:1px solid var(--blb);padding:2px 8px;border-radius:99px;white-space:nowrap;}
.et-cuota{font-family:var(--hf);font-size:14px;font-weight:800;}
.et-ev{font-family:var(--hf);font-size:14px;font-weight:800;}

/* ─── NO APOSTAR ─────────────────────────────────── */
.na-card{display:flex;gap:12px;align-items:flex-start;background:rgba(248,113,113,.04);border:1px solid var(--reb);border-radius:var(--rds);padding:13px 15px;margin-bottom:8px;}
.na-ico{width:28px;height:28px;border-radius:var(--rdxs);background:var(--red);border:1px solid var(--reb);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.na-ico svg{width:13px;height:13px;color:var(--re);}
.na-liga{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--re);margin-bottom:3px;}
.na-match{font-family:var(--hf);font-size:14px;font-weight:800;text-transform:uppercase;margin-bottom:3px;}
.na-razon{font-size:11px;color:var(--tx3);line-height:1.55;}

/* ─── EMPTY STATE ────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;padding:56px 20px;text-align:center;gap:12px;}
.empty-icon{width:52px;height:52px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;}
.empty-icon svg{width:24px;height:24px;opacity:.4;}
.empty-title{font-family:var(--hf);font-size:19px;font-weight:800;color:var(--tx2);}
.empty-sub{font-size:12px;color:var(--tx3);max-width:270px;line-height:1.65;}
.empty-pill{font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pu);background:var(--pud);border:1px solid var(--pub);padding:5px 14px;border-radius:99px;}

/* ─── BOTTOM STATS ───────────────────────────────── */
.b-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.bs{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rd);padding:14px;text-align:center;}
.bs-v{font-family:var(--hf);font-size:22px;font-weight:900;}
.bs-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:3px;font-weight:600;}
/* ─── PANEL IA APRENDE / RENDIMIENTO ─── */
.lrn-hero{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.lrn-roi{flex:2;min-width:150px;border-radius:var(--rd);padding:16px 18px;border:1px solid;display:flex;flex-direction:column;justify-content:center;}
.lrn-roi.pos{background:linear-gradient(135deg,var(--grd),rgba(16,185,129,.02));border-color:var(--grb);}
.lrn-roi.neg{background:linear-gradient(135deg,var(--red),rgba(248,113,113,.02));border-color:var(--reb);}
.lrn-roi.neu{background:var(--sf2);border-color:var(--bd);}
.lrn-roi-v{font-family:var(--hf);font-size:36px;font-weight:900;line-height:1;}
.lrn-roi.pos .lrn-roi-v{color:var(--gr);}.lrn-roi.neg .lrn-roi-v{color:var(--re);}.lrn-roi.neu .lrn-roi-v{color:var(--tx2);}
.lrn-roi-l{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);margin-top:7px;}
.lrn-mini{flex:1;min-width:82px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rd);padding:14px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;}
.lrn-mini-v{font-family:var(--hf);font-size:22px;font-weight:900;line-height:1;}
.lrn-mini-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-top:4px;font-weight:600;}
.lrn-sports{display:flex;flex-direction:column;gap:7px;margin-bottom:6px;}
.lrn-row{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rds);padding:9px 12px;transition:border-color .2s;}
.lrn-row:hover{border-color:var(--bd2);}
.lrn-ico{width:26px;height:26px;border-radius:var(--rdxs);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lrn-name{font-family:var(--hf);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;min-width:52px;}
.lrn-wl{font-family:var(--hf);font-size:12px;font-weight:700;color:var(--tx2);min-width:46px;font-variant-numeric:tabular-nums;}
.lrn-bar{flex:1;height:6px;background:var(--sf2);border-radius:99px;overflow:hidden;min-width:36px;}
.lrn-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.22,1,.36,1);}
.lrn-pill{font-family:var(--hf);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid;flex-shrink:0;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;}
.lrn-pill.pos{color:var(--gr);background:var(--grd);border-color:var(--grb);}
.lrn-pill.neg{color:var(--re);background:var(--red);border-color:var(--reb);}
.lrn-pill.neu{color:var(--tx3);background:var(--sf2);border-color:var(--bd);}
.lrn-cal{font-size:11px;color:var(--tx2);line-height:1.55;background:var(--amd);border:1px solid var(--amb);border-radius:var(--rds);padding:9px 12px;margin-top:8px;display:flex;gap:8px;align-items:flex-start;}
.lrn-cal svg{flex-shrink:0;color:var(--am);margin-top:1px;}
.lrn-cal b{color:var(--am);}

/* ─── DAY NAVIGATOR ─────────────────────────────── */
.day-nav{display:flex;align-items:center;justify-content:center;gap:0;padding:7px 0 0;}
.day-nav-btn{background:none;border:none;cursor:pointer;color:var(--tx3);padding:5px 10px;border-radius:8px;transition:color .15s,background .15s;display:flex;align-items:center;justify-content:center;}
.day-nav-btn:hover:not(:disabled){color:var(--pu);background:var(--pus);}
.day-nav-btn:disabled{opacity:.2;cursor:default;}
.day-nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.day-nav-center{display:flex;align-items:center;gap:6px;padding:5px 16px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);cursor:pointer;transition:border-color .15s;min-width:170px;justify-content:center;}
.day-nav-center:hover{border-color:var(--bd2);}
.day-nav-label{font-family:var(--hf);font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--tx);text-transform:uppercase;}
.day-nav-today{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--pu);background:var(--pud);border:1px solid var(--pub);padding:2px 7px;border-radius:99px;}
.day-nav-chevron{width:12px;height:12px;stroke:var(--tx3);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* ─── LOADING ────────────────────────────────────── */
#loadScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 20px;gap:14px;position:relative;z-index:1;}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,229,180,.12);border-top-color:var(--cy);animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.load-txt{font-family:var(--hf);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);}
#app{display:none;}

@media(max-width:500px){
  .dh-title{font-size:36px;}
  .picks-grid{grid-template-columns:1fr;}
  .gc-tname{font-size:28px;}
  .pl-stats{grid-template-columns:repeat(2,1fr);}
  .b-stats{grid-template-columns:repeat(2,1fr);}
  .pd-grid{grid-template-columns:repeat(2,1fr);}
}

/* ═══ LIQUID GLASS: reflejos especulares + luz de canto ═══════════════════ */
.pick-card::before,.gold-card::before,.calc-card::before,.mr-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(140deg,rgba(167,139,250,.18) 0%,rgba(167,139,250,.03) 36%,transparent 62%);
}
.pick-card::after,.calc-card::after,.mr-card::after,.gold-card::after{
  content:'';position:absolute;left:12%;right:12%;bottom:0;height:1px;pointer-events:none;z-index:0;
  background:linear-gradient(90deg,transparent,var(--pub),transparent);
}
.pick-card>*,.calc-card>*,.mr-card>*{position:relative;z-index:1;}
.gold-card>.gold-topbar,.gold-card>.gc-inner{position:relative;z-index:1;}
.gold-card>.gold-badge{z-index:2;}

/* ═══ SELECCIÓN: "Mi Ticket" ═════════════════════════════════════════════ */
.pc-inner{position:relative;}
.pc-ctx{padding-right:34px;}
.sel-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:var(--rdxs);border:1px solid var(--bd2);background:var(--sf3);color:var(--tx3);display:flex;align-items:center;justify-content:center;gap:0;cursor:pointer;z-index:3;line-height:1;transition:color .18s,border-color .18s,background .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent;}
.sel-btn .sel-glyph{font-family:var(--hf);font-size:18px;font-weight:800;}
.sel-btn:hover{color:var(--tx);border-color:var(--bd3);}
.sel-btn.on{color:var(--cy);border-color:var(--cyb);background:var(--cyd);box-shadow:0 0 14px var(--cyb);}
.sel-btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px;}
.sel-btn-lg{position:static;width:auto;height:auto;padding:6px 13px;gap:6px;border-radius:99px;font-family:var(--hf);font-size:11px;font-weight:800;letter-spacing:.5px;}
.sel-btn-lg .sel-glyph{font-size:15px;}
.pick-card.selected{border-color:var(--cyb);box-shadow:0 0 22px var(--cyb),inset 0 1px 0 rgba(167,139,250,.26);}
.gold-card.selected{border-color:var(--cyb);}

/* ═══ BANKROLL: unidad, hint, exposición ═════════════════════════════════ */
.calc-unit{display:flex;align-items:center;gap:6px;margin-left:auto;}
.calc-input-sm{width:66px;font-size:16px;padding:6px 8px;}
.calc-hint{font-size:11px;color:var(--tx3);line-height:1.5;margin:2px 0 14px;}
.calc-hint b{color:var(--tx2);}
.expo{margin:6px 0 14px;}
.expo-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;}
.expo-lbl{font-family:var(--hf);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);}
.expo-val{font-family:var(--hf);font-size:13px;font-weight:800;color:var(--tx2);white-space:nowrap;}
.expo-bar{position:relative;height:8px;background:var(--bg3);border:1px solid var(--bd);border-radius:99px;}
.expo-fill{height:100%;width:0;border-radius:99px;transition:width .35s cubic-bezier(.22,1,.36,1),background .3s;}
.expo-fill.ok{background:linear-gradient(90deg,#00b894,#00e5b4);}
.expo-fill.near{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.expo-fill.over{background:linear-gradient(90deg,#dc2626,#f87171);}
.expo-tope{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx2);opacity:.55;border-radius:2px;}
.expo-foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:10px;color:var(--tx3);line-height:1.4;}
.expo-topelbl{white-space:nowrap;}
.ci.on{border-color:var(--cyb);box-shadow:0 0 12px var(--cys);}

/* ═══ MI REPORTE ═════════════════════════════════════════════════════════ */
.mr-card{position:relative;overflow:hidden;background:var(--sf2);border:1px solid var(--bd2);border-radius:var(--rd);padding:16px 18px;margin-bottom:12px;contain:paint;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(167,139,250,.26);}
.mr-title{font-family:var(--hf);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-bottom:12px;}
.mr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.mr-stats-5{grid-template-columns:repeat(5,1fr);}
.mrs{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rds);padding:10px 6px;text-align:center;}
.mrs-v{font-family:var(--hf);font-size:22px;font-weight:900;line-height:1;}
.mrs-l{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-top:3px;font-weight:600;}
.mr-pnl{display:flex;gap:10px;}
.mr-pnl-item{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rds);padding:12px 14px;}
.mr-pnl-l{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;}
.mr-pnl-v{font-family:var(--hf);font-size:26px;font-weight:900;line-height:1;}
.mr-pnl-v.pos{color:var(--gr);}.mr-pnl-v.neg{color:var(--re);}.mr-pnl-v.neu{color:var(--tx2);}
.mr-note{font-size:11px;color:var(--tx3);line-height:1.55;margin-top:10px;}
.mr-foot{font-size:10px;color:var(--tx4);line-height:1.55;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);}
.mr-foot b,.mr-note b{color:var(--tx2);}
.mr-empty{font-size:12px;color:var(--tx3);line-height:1.6;}
.mr-spark{width:100%;height:46px;margin-top:12px;display:block;}
.mr-comp{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 2px;}
.mr-comp-col{text-align:center;flex:1;}
.mr-comp-l{font-family:var(--hf);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;}
.mr-comp-v{font-family:var(--hf);font-size:26px;font-weight:900;line-height:1;}
.mr-comp-v.pos{color:var(--gr);}.mr-comp-v.neg{color:var(--re);}.mr-comp-v.neu{color:var(--tx2);}
.mr-comp-vs{font-family:var(--hf);font-size:12px;font-weight:700;color:var(--tx4);}
.mr-actions{display:flex;gap:10px;margin-top:4px;}
.mr-btn{flex:1;font-family:var(--hf);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:11px 14px;border-radius:var(--rds);border:1px solid var(--bd2);background:var(--sf2);color:var(--tx2);cursor:pointer;transition:all .18s;}
.mr-btn:hover{border-color:var(--bd3);color:var(--tx);}
.mr-btn:focus-visible{outline:2px solid var(--pu);outline-offset:2px;}
.mr-btn-danger{color:var(--re);border-color:var(--reb);background:var(--red);}
.mr-btn-danger:hover{background:rgba(248,113,113,.2);}
@media(max-width:500px){.mr-stats,.mr-stats-5{grid-template-columns:repeat(3,1fr);}}

/* ═══ AJUSTES: switch Modo ligero ════════════════════════════════════════ */
.settings-row{display:flex;align-items:center;gap:14px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rds);padding:14px 16px;}
.set-txt{flex:1;}
.set-title{font-family:var(--hf);font-size:14px;font-weight:800;color:var(--tx);}
.set-sub{font-size:11px;color:var(--tx3);line-height:1.5;margin-top:3px;}
.switch{flex-shrink:0;width:48px;height:28px;border-radius:99px;border:1px solid var(--bd2);background:var(--bg3);position:relative;cursor:pointer;transition:background .2s,border-color .2s;padding:0;}
.switch-knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--tx3);transition:transform .2s,background .2s;}
.switch.on{background:var(--cyd);border-color:var(--cyb);}
.switch.on .switch-knob{transform:translateX(20px);background:var(--cy);}
.switch:focus-visible{outline:2px solid var(--cy);outline-offset:2px;}

/* ═══ FOCUS VISIBLE en controles existentes ══════════════════════════════ */
.tab-btn:focus-visible,.day-nav-btn:focus-visible,.day-nav-center:focus-visible{outline:2px solid var(--pu);outline-offset:2px;}

/* ═══ MODO LIGERO: apaga todo el cristal ═════════════════════════════════ */
body.no-glass .pick-card,body.no-glass .gold-card,body.no-glass .calc-card,body.no-glass .mr-card,body.no-glass .topbar{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
body.no-glass .pick-card,body.no-glass .calc-card,body.no-glass .mr-card{background:var(--bg3);}
body.no-glass .pick-card::before,body.no-glass .pick-card::after,
body.no-glass .gold-card::before,body.no-glass .gold-card::after,
body.no-glass .calc-card::before,body.no-glass .calc-card::after,
body.no-glass .mr-card::before,body.no-glass .mr-card::after{display:none;}

/* ═══ FALLBACK: navegadores sin backdrop-filter ══════════════════════════ */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .pick-card,.calc-card,.mr-card{background:var(--bg3);}
}

/* ═══ RESPETO A prefers-reduced-motion ═══════════════════════════════════ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}
</style>

<script>
// ─── UTILS ───────────────────────────────────────────────────────────────────
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtDate(d){return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' '+d.getFullYear();}

function tick(){
  var n=new Date();
  // Próxima 12:30 AM hora CDMX (UTC-5) = 05:30 UTC
  var utcMs=n.getTime()+n.getTimezoneOffset()*60000;
  var cdmxNow=new Date(utcMs-5*3600000);
  var next=new Date(cdmxNow);
  next.setHours(0,30,0,0);
  if(cdmxNow>=next)next.setDate(next.getDate()+1);
  var dt=next-cdmxNow,e=document.getElementById('cdwn');
  if(e)e.textContent=pad(Math.floor(dt/3600000))+':'+pad(Math.floor(dt%3600000/60000))+':'+pad(Math.floor(dt%60000/1000));
}
setInterval(tick,1000);tick();

function switchTab(id){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var s=document.getElementById('sec-'+id);if(s)s.classList.add('active');
  var b=document.querySelector('[data-tab="'+id+'"]');if(b)b.classList.add('active');
  if(id==='resumen'&&typeof renderMyReport==='function')renderMyReport(); // refresca Mi Reporte al abrir
}

// ─── STORAGE (Mi Ticket · bankroll · preferencias) ────────────────────────────
// localStorage versionado, con try/catch por modo privado. Si falla, el sitio
// funciona igual sin persistencia.
var TPI={
  K:{bankroll:'tpi:v1:bankroll',unit:'tpi:v1:unit_pct',lite:'tpi:v1:lite',ticket:'tpi:v1:ticket'},
  ok:(function(){try{var k='tpi:v1:__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}})(),
  get:function(k,def){try{var v=localStorage.getItem(k);return v==null?def:v;}catch(e){return def;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  getJSON:function(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}},
  setJSON:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
// Clave estable por pick (no existe campo id). Usa SIEMPRE data.fecha del JSON.
function pickKey(fecha,p){
  return (fecha+'|'+(p.matchup||'')+'|'+(p.pick||''))
    .toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9|\-@]/g,'');
}
function getBankroll(){var v=parseFloat(TPI.get(TPI.K.bankroll,'10000'));return isFinite(v)&&v>0?v:10000;}
function getUnitPct(){var v=parseFloat(TPI.get(TPI.K.unit,'1'));return isFinite(v)&&v>0?v:1;}
function stakeU(stake){var v=parseFloat(String(stake==null?'':stake).replace(/u/i,''));return isFinite(v)?v:0;} // "0.25u" -> 0.25
// Monto real: 1u = unit_pct% del bankroll. amount = bankroll * stake_u * unit_pct / 100.
function amountFor(su){return getBankroll()*su*getUnitPct()/100;}
function fmtMoney(n){var r=Math.round(n);return '$'+String(r).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function getTicket(){var t=TPI.getJSON(TPI.K.ticket,{});return (t&&typeof t==='object')?t:{};}
function saveTicket(t){TPI.setJSON(TPI.K.ticket,t);}
function isSelected(fecha,p){var t=getTicket();return !!(t[fecha]&&t[fecha][pickKey(fecha,p)]);}
function ticketCount(fecha){var t=getTicket();return (t[fecha]?Object.keys(t[fecha]).length:0);}
function toggleSelection(fecha,p){
  var t=getTicket(),k=pickKey(fecha,p);
  if(!t[fecha])t[fecha]={};
  if(t[fecha][k]){
    delete t[fecha][k];
    if(!Object.keys(t[fecha]).length)delete t[fecha];
  } else {
    // Guarda la cuota AL MOMENTO de seleccionar (la que el usuario tomó).
    t[fecha][k]={
      matchup:p.matchup||'',pick:p.pick||'',liga:p.liga||'',
      cuota:(p.cuota_bet365!=null?p.cuota_bet365:(p.cuota!=null?p.cuota:null)),
      stake_u:stakeU(p.stake),ev_pct:(p.ev_pct!=null?p.ev_pct:null),
      estrellas:p.estrellas||0,ts:Date.now()
    };
  }
  saveTicket(t);
  syncSelectionUI(fecha);
  updateExposure();
  if(typeof renderMyReport==='function')renderMyReport(); // mantiene "Mi Reporte" en sync
}
// Aplica/actualiza el estado visual de selección en todas las tarjetas del día.
function syncSelectionUI(fecha){
  document.querySelectorAll('[data-selkey]').forEach(function(btn){
    var sel=btn.getAttribute('data-selkey');
    var t=getTicket();
    var on=!!(t[fecha]&&t[fecha][sel]);
    var card=btn.closest('.pick-card,.gold-card');
    btn.setAttribute('aria-pressed',on?'true':'false');
    var pk=btn.getAttribute('data-pickname')||'';
    btn.setAttribute('aria-label',(on?'Quitar':'Añadir')+' '+pk+(on?' de':' a')+' mi ticket');
    btn.classList.toggle('on',on);
    var glyph=btn.querySelector('.sel-glyph');
    if(glyph)glyph.textContent=on?'✓':'+';
    var lbl=btn.querySelector('.sel-lbl');
    if(lbl)lbl.textContent=on?'EN MI TICKET':'MI TICKET';

// ─── SPORT DETECTION ─────────────────────────────────────────────────────────
function getSport(liga){
  var l=(liga||'').toLowerCase();
  if(l.includes('mlb'))return'mlb';
  if(l.includes('nba'))return'nba';
  if(l.includes('tennis')||l.includes('tenis')||l.includes('atp')||l.includes('wta'))return'tennis';
  if(l.includes('liga')||l.includes('premier')||l.includes('mls')||l.includes('futbol')||l.includes('fútbol')||l.includes('soccer')||l.includes('serie a')||l.includes('ligue')||l.includes('eredivisie')||l.includes('championship')||l.includes('brasileir')||l.includes('brazil')||l.includes('argentin')||l.includes('primera')||l.includes('uefa')||l.includes('champions')||l.includes('europa'))return'futbol';
  if(l.includes('nfl')||l.includes('american football')||l.includes('football'))return'nfl';
  return'otros';
}
// Deporte robusto: primero por sport_key del pick (fiable), luego por texto de liga.
function sportOf(p){
  var sk=((p&&p.sport_key)||'').toLowerCase();
  if(sk.indexOf('soccer')===0)return'futbol';
  if(sk.indexOf('baseball')===0)return'mlb';
  if(sk.indexOf('basketball')===0)return'nba';
  if(sk.indexOf('americanfootball')===0)return'nfl';
  if(sk.indexOf('tennis')===0)return'tennis';
  return getSport(p&&p.liga);
}
function parseTeams(matchup){
  var m=matchup||'';
  if(m.indexOf(' @ ')>-1){var p=m.split(' @ ');return{away:p[0].trim().toUpperCase(),home:(p[1]||'').trim().toUpperCase()};}
  if(m.toLowerCase().indexOf(' vs ')>-1){var p=m.split(/ vs /i);return{away:p[0].trim().toUpperCase(),home:(p[1]||'').trim().toUpperCase()};}
  return{away:m.toUpperCase(),home:''};
}

function logoHTML(rawName,liga,sizePx,logoUrl){
  var sz=sizePx||40;
  var name=(rawName||'').toUpperCase().trim().replace(/^@\s*/,'').trim();
  var sport=getSport(liga);

  // Imagen directa del pick: logo de equipo (fútbol) o foto de jugador (tenis).
  if(logoUrl){
    var safe=name.replace(/'/g,'').replace(/\\/g,'');
    var isPhoto=logoUrl.indexOf('/headshots/')>-1;   // headshot ESPN de tenista
    var imgStyle=isPhoto
      ?'width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:50%'
      :'width:100%;height:100%;object-fit:contain';
    return'<div class="t-logo" style="width:'+sz+'px;height:'+sz+'px">'+
      '<img src="'+logoUrl+'" alt="'+name+'" style="'+imgStyle+'" onerror="_logoErr(this,\''+safe+'\',\''+sport+'\')">'+
    '</div>';
  }

  // MLB → logo oficial, onerror llama función global sin HTML embebido
  if(sport==='mlb'){
    var id=MLB_IDS[name]||MLB_FULLNAMES[name];
    if(id){
      return'<div class="t-logo" style="width:'+sz+'px;height:'+sz+'px">'+
        '<img src="https://www.mlbstatic.com/team-logos/'+id+'.svg" alt="'+name+'" style="width:100%;height:100%;object-fit:contain" onerror="_logoErr(this,\''+name+'\',\'mlb\')">'+
      '</div>';
    }
  }

  if(sport==='nba'){
    var nid=NBA_IDS[name]||NBA_FULLNAMES[name];
    if(nid){
      return'<div class="t-logo" style="width:'+sz+'px;height:'+sz+'px">'+

      'font-size:'+fs2+'px;'+
      'color:'+nc2+';'+
      'text-shadow:0 0 '+g2+'px '+nc2+',0 0 '+(g2*2)+'px '+nc2+'66;'+
      'background:#000;'+
      'background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);'+
      'background-size:4px 4px;'+
      'width:100%;height:100%;'+
      'border-radius:'+r2+'px;'+
      'border:2px solid '+nc2+';'+

    var nm=m?m[1].trim().toUpperCase():raw.toUpperCase();

    '<div class="parlay-head">'+
      '<div>'+
        '<div class="parlay-title">PARLAY SUGERIDO</div>'+

      '</div>'+
    '</div>'+
    '<div class="parlay-body">'+
      '<div class="pl-legs">'+legs+'</div>'+
      '<div class="pl-stats">'+

function buildSport(allPicks,allNA,sport,label,icoId){
  var picks=allPicks.filter(function(p){return sportOf(p)===sport;});
  var na=allNA.filter(function(p){
    var l=(p.liga||'').toLowerCase();
    return(sport==='mlb'&&l.includes('mlb'))||(sport==='nba'&&l.includes('nba'))||
           (sport==='futbol'&&getSport(l)==='futbol')||
           (sport==='nfl'&&(l.includes('nfl')||l.includes('football')))||
           (sport==='tennis'&&(l.includes('tennis')||l.includes('tenis')||l.includes('atp')||l.includes('wta')));
  });

  var hdr='<div class="sh"><div class="sh-ico" style="background:var(--cyd);color:var(--cy)">'+useIco(icoId)+'</div><div class="sh-title">'+label+'</div><div class="sh-line"></div><div class="sh-ct">'+picks.length+' PICKS</div></div>';
  var body='';

    var emptyMsg=sport==='nfl'
      ?'<div class="empty">'+
          '<div class="empty-icon" style="color:var(--nfl)">'+useIco(icoId,24)+'</div>'+
          '<div class="empty-title" style="color:var(--nfl)">TEMPORADA NFL</div>'+

          '<div class="empty-pill" style="color:var(--nfl);background:var(--nfld);border-color:var(--nflb)">ACTIVA EN SEP 2026 · DRAFT MAYO</div>'+
        '</div>'
      :'<div class="empty">'+
          '<div class="empty-icon" style="color:var(--tx3)">'+useIco(icoId,24)+'</div>'+
          '<div class="empty-title">SIN PARTIDOS HOY</div>'+
          '<div class="empty-sub">No hay partidos de '+label+' hoy. Vuelve mañana a las 12:30 AM para el siguiente análisis.</div>'+
          '<div class="empty-pill">PRÓXIMO ANÁLISIS 12:30 AM CDMX</div>'+
        '</div>';
    body=emptyMsg;
  } else if(picks.length){
    body='<div class="picks-grid" id="pgrid-'+sport+'"></div>';
  } else {
    // Hay partidos pero ninguno con pick: un aviso breve antes de la lista "No Apostar".
    body='<div class="empty" style="padding:18px 16px">'+
           '<div class="empty-title" style="font-size:13px">SIN PICKS HOY EN '+label.toUpperCase()+'</div>'+
           '<div class="empty-sub">No se identificó valor esperado positivo. Estos son los partidos de hoy:</div>'+
         '</div>';

  var naHtml='';
  if(na.length){
    naHtml+='<div class="sh" style="margin-top:20px"><div class="sh-ico" style="background:var(--red);color:var(--re)">'+useIco('ico-ban')+'</div><div class="sh-title">NO APOSTAR</div><div class="sh-line"></div></div>';
    na.forEach(function(n){
      naHtml+='<div class="na-card"><div class="na-ico">'+useIco('ico-alert')+'</div>'+
        '<div><div class="na-liga">'+(n.liga||'').toUpperCase()+'</div>'+

        '<div class="na-razon">'+(n.razon||'')+'</div></div></div>';

  wrap.innerHTML=hdr+body+naHtml;

}

// ─── BANKROLL DINÁMICO + EXPOSICIÓN ──────────────────────────────────────────
var TOPE_PCT=20;            // tope de exposición diaria sugerido (%)
var _bkDebounce=null;
function buildCalc(){
  var bk=getBankroll(),up=getUnitPct();
  return'<div class="calc-card">'+
    '<div class="calc-title"><div class="calc-icon" style="color:var(--am)">'+useIco('ico-wallet',14)+'</div>BANKROLL &amp; EXPOSICIÓN</div>'+
    '<div class="calc-row">'+
      '<div class="calc-lbl">Mi Bankroll:</div><div class="calc-curr">MXN $</div>'+
      '<input class="calc-input" id="bkInput" type="number" value="'+bk+'" min="100" step="100" inputmode="numeric">'+
      '<div class="calc-unit"><div class="calc-lbl">1u =</div>'+
        '<input class="calc-input calc-input-sm" id="unitInput" type="number" value="'+up+'" min="0.1" max="10" step="0.1" inputmode="decimal"><span class="calc-curr">%</span>'+
      '</div>'+
    '</div>'+
    '<div class="calc-hint">Cada unidad (1u) vale <b id="unitVal">'+fmtMoney(bk*up/100)+'</b>. El stake de cada pick (p. ej. 0.25u) se convierte a pesos con esta regla: <b>monto = bankroll × stake × unit% ÷ 100</b>.</div>'+
    '<div class="expo">'+
      '<div class="expo-head"><span class="expo-lbl">EXPOSICIÓN · <span class="ticket-count">0</span> en mi ticket</span><span class="expo-val" id="expoVal">$0 · 0%</span></div>'+
      '<div class="expo-bar"><div class="expo-fill ok" id="expoFill"></div><div class="expo-tope" style="left:'+TOPE_PCT+'%"></div></div>'+
      '<div class="expo-foot"><span id="expoNote">Selecciona picks con “+” para sumarlos a tu ticket.</span><span class="expo-topelbl">tope '+TOPE_PCT+'%</span></div>'+
    '</div>'+
    '<div class="calc-grid" id="calcGrid"></div>'+
  '</div>';
}
// Lee el valor en vivo de los inputs (aunque aún no se haya persistido).
function liveBankroll(){var v=parseFloat((document.getElementById('bkInput')||{}).value);return (isFinite(v)&&v>0)?v:getBankroll();}
function liveUnitPct(){var v=parseFloat((document.getElementById('unitInput')||{}).value);return (isFinite(v)&&v>0)?v:getUnitPct();}
// Escribe con debounce ~300ms; recalcula la UI al instante.
function onBankrollInput(){
  var el=document.getElementById('bkInput');if(!el)return;
  var v=el.value;
  if(_bkDebounce)clearTimeout(_bkDebounce);
  _bkDebounce=setTimeout(function(){TPI.set(TPI.K.bankroll,String(parseFloat(v)||10000));},300);
  refreshCalc();updateExposure();
}
function onUnitInput(){
  var el=document.getElementById('unitInput');if(!el)return;
  var v=el.value;
  if(_bkDebounce)clearTimeout(_bkDebounce);
  _bkDebounce=setTimeout(function(){TPI.set(TPI.K.unit,String(parseFloat(v)||1));},300);
  refreshCalc();updateExposure();
}
function bindCalc(){
  var b=document.getElementById('bkInput');if(b)b.addEventListener('input',onBankrollInput);
  var u=document.getElementById('unitInput');if(u)u.addEventListener('input',onUnitInput);
}
function refreshCalc(){
  var grid=document.getElementById('calcGrid');
  if(!grid||!window._PICKS)return;
  var fecha=window._FECHA||'';
  var bk=liveBankroll(),up=liveUnitPct();
  var uv=document.getElementById('unitVal');if(uv)uv.textContent=fmtMoney(bk*up/100);
  grid.innerHTML=window._PICKS.map(function(p){
    var su=stakeU(p.stake);
    var amt=bk*su*up/100;
    var on=isSelected(fecha,p);
    return'<div class="ci'+(on?' on':'')+'"><div class="ci-pick">'+(p.pick||'').toUpperCase()+'</div><div class="ci-amt">'+fmtMoney(amt)+'</div><div class="ci-pct">'+su+'u · '+(su*up).toFixed(2)+'% bankroll</div></div>';
  }).join('');
}
// Barra de exposición = suma de stakes de los picks SELECCIONADOS del día.
function updateExposure(){
  var fecha=window._FECHA||'';
  var t=getTicket(),day=t[fecha]||{};
  var bk=liveBankroll(),up=liveUnitPct();
  var sumU=0,amt=0;
  Object.keys(day).forEach(function(k){var s=day[k];sumU+=(s.stake_u||0);amt+=bk*(s.stake_u||0)*up/100;});
  var pct=sumU*up; // % del bankroll
  var fill=document.getElementById('expoFill');
  var val=document.getElementById('expoVal');
  var note=document.getElementById('expoNote');
  var cls=pct>TOPE_PCT?'over':(pct>=TOPE_PCT*0.75?'near':'ok');
  if(fill){fill.style.width=Math.min(pct,100)+'%';fill.className='expo-fill '+cls;}
  if(val)val.textContent=fmtMoney(amt)+' · '+pct.toFixed(1)+'%';
  if(note){
    var n=Object.keys(day).length;
    if(!n)note.textContent='Selecciona picks con “+” para sumarlos a tu ticket.';
    else if(cls==='over')note.textContent='Por encima del tope diario ('+TOPE_PCT+'%). Considera reducir stakes.';
    else if(cls==='near')note.textContent='Acercándote al tope diario ('+TOPE_PCT+'%).';
    else note.textContent=n+' pick'+(n===1?'':'s')+' seleccionado'+(n===1?'':'s')+' · dentro del tope.';
  }
  updateTicketCounters(fecha);
}

function resBadge(r){
  if(r.resultado==='win')
    return '<span class="res-win">✓ WIN'+(r.score?'<span class="res-score">'+r.score+'</span>':'')+'</span>';
  if(r.resultado==='loss')
    return '<span class="res-loss">✗ LOSS'+(r.score?'<span class="res-score">'+r.score+'</span>':'')+'</span>';
  if(r.resultado==='push')
    return '<span class="res-push">— PUSH'+(r.score?'<span class="res-score">'+r.score+'</span>':'')+'</span>';
  return '<span class="res-pending">⏳ PENDIENTE</span>';
}

function applyResults(resData){
  if(!resData||!resData.picks)return;
  var cards=document.querySelectorAll('.pick-card[data-matchup],.gold-card[data-matchup]');
  resData.picks.forEach(function(r){
    var mu=(r.matchup||'').toLowerCase();
    var pk=(r.pick||'').toLowerCase();
    cards.forEach(function(card){
      if(card.dataset.matchup===mu||card.dataset.pick===pk){
        // Eliminar badge previo si existe
        var old=card.querySelector('.res-badge-wrap');
        if(old)old.remove();
        var wrap=document.createElement('div');
        wrap.className='res-badge-wrap';
        wrap.style.cssText='padding:6px 15px 0;';
        wrap.innerHTML=resBadge(r);
        var inner=card.querySelector('.pc-inner,.gc-inner');
        if(inner)inner.insertBefore(wrap,inner.firstChild);
        // Borde verde/rojo en la card
        if(r.resultado==='win'){card.style.borderColor='rgba(16,185,129,.5)';card.style.boxShadow='0 0 20px rgba(16,185,129,.18)';}
        else if(r.resultado==='loss'){card.style.borderColor='rgba(248,113,113,.45)';card.style.boxShadow='0 0 20px rgba(248,113,113,.15)';}
      }
    });
  });

  // Barra de resumen del día
  var sm=resData.resumen;
  if(!sm)return;
  var existing=document.getElementById('dayResultsBar');
  if(existing)existing.remove();
  var roi=sm.roi_pct||0;
  var roiClass=roi>0?'pos':roi<0?'neg':'neu';
  var roiStr=(roi>0?'+':'')+roi.toFixed(1)+'% ROI';
  var bar=document.createElement('div');
  bar.id='dayResultsBar';
  bar.className='day-results-bar';
  bar.innerHTML=
    '<div class="drb-stat"><div class="drb-v" style="color:var(--gr)">'+sm.wins+'</div><div class="drb-l">Wins</div></div>'+
    '<div class="drb-stat"><div class="drb-v" style="color:var(--re)">'+sm.losses+'</div><div class="drb-l">Losses</div></div>'+
    '<div class="drb-div"></div>'+
    '<div class="drb-stat"><div class="drb-v" style="color:var(--tx2)">'+sm.pushes+'</div><div class="drb-l">Push</div></div>'+
    '<div class="drb-stat"><div class="drb-v" style="color:var(--tx3)">'+sm.pending+'</div><div class="drb-l">Pend.</div></div>'+
    '<div class="drb-div"></div>'+
    '<div class="drb-stat"><div class="drb-v" style="color:var(--tx2)">'+sm.total+'</div><div class="drb-l">Total</div></div>'+
    '<div class="drb-roi '+roiClass+'">'+roiStr+'</div>';
  // Insertar antes del primer .sh o al inicio de sec-inicio
  var ini=document.getElementById('sec-inicio');
  if(ini)ini.insertBefore(bar,ini.firstChild);
}

function loadResults(dateStr){
  fetch('/results-'+dateStr+'.json')
    .then(function(r){if(!r.ok)throw new Error('no results');return r.json();})
    .then(function(d){applyResults(d);})
    .catch(function(){/* sin resultados aún — silencioso */});
}

// ─── MI REPORTE: liquidación de tu ticket personal ───────────────────────────
var RES_CACHE={}; // date -> results json | null (404). Cacheado en memoria.
function fetchResultsCached(date){
  if(Object.prototype.hasOwnProperty.call(RES_CACHE,date))return Promise.resolve(RES_CACHE[date]);
  return fetch('/results-'+date+'.json')
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){RES_CACHE[date]=j;return j;})
    .catch(function(){RES_CACHE[date]=null;return null;});
}
// Cruza por pick (preferente) o matchup en minúsculas, igual criterio que applyResults.
function findResult(resJson,sel){
  if(!resJson||!resJson.picks)return null;
  var pk=(sel.pick||'').toLowerCase(),mu=(sel.matchup||'').toLowerCase(),byMatch=null;
  for(var i=0;i<resJson.picks.length;i++){
    var r=resJson.picks[i];
    if((r.pick||'').toLowerCase()===pk)return r;
    if(!byMatch&&(r.matchup||'').toLowerCase()===mu)byMatch=r;
  }
  return byMatch;
}
function settleDate(date,resJson){
  var t=getTicket(),day=t[date]||{};
  var o={date:date,sel:0,open:0,won:0,lost:0,push:0,staked:0,profit:0};
  Object.keys(day).forEach(function(k){
    var s=day[k];o.sel++;
    var r=findResult(resJson,s);
    var resu=r?r.resultado:null;
    var cuota=(s.cuota!=null?s.cuota:(r&&r.cuota!=null?r.cuota:1));
    var monto=amountFor(s.stake_u||0);
    if(resu==='win'){o.won++;o.staked+=monto;o.profit+=monto*((cuota||1)-1);}
    else if(resu==='loss'){o.lost++;o.staked+=monto;o.profit-=monto;}
    else if(resu==='push'){o.push++;o.staked+=monto;}
    else{o.open++;}
  });
  o.roi=o.staked>0?(o.profit/o.staked*100):0;
  return o;
}
function signMoney(v){return (v>=0?'+':'-')+fmtMoney(Math.abs(v));}
function signPct(v){return (v>=0?'+':'-')+Math.abs(v).toFixed(1)+'%';}
function pnlClass(v){return v>0.0001?'pos':v<-0.0001?'neg':'neu';}

function mrTodayHTML(o,fecha){
  var pnlC=pnlClass(o.profit),roiC=pnlClass(o.roi);
  var settled=o.won+o.lost+o.push;
  return '<div class="mr-card">'+
    '<div class="mr-title">HOY · '+fecha+'</div>'+
    '<div class="mr-stats">'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--pu)">'+o.sel+'</div><div class="mrs-l">Seleccionados</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--tx3)">'+o.open+'</div><div class="mrs-l">Abiertos</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--gr)">'+o.won+'</div><div class="mrs-l">Ganados</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--re)">'+o.lost+'</div><div class="mrs-l">Perdidos</div></div>'+
    '</div>'+
    '<div class="mr-pnl">'+
      '<div class="mr-pnl-item"><div class="mr-pnl-l">P&amp;L</div><div class="mr-pnl-v '+pnlC+'">'+(settled?signMoney(o.profit):'—')+'</div></div>'+
      '<div class="mr-pnl-item"><div class="mr-pnl-l">ROI</div><div class="mr-pnl-v '+roiC+'">'+(settled?signPct(o.roi):'—')+'</div></div>'+
    '</div>'+
    (settled?'':'<div class="mr-note">Tus picks de hoy aún no se liquidan. El P&amp;L aparece cuando publican los resultados.</div>')+
  '</div>';
}
function mrSparkline(perDate){
  // curva simple de P&L acumulado por fecha
  var cum=0,pts=[],anySettled=false;
  perDate.forEach(function(o){if(o.staked>0)anySettled=true;cum+=o.profit;pts.push(cum);});
  if(!anySettled||pts.length<2)return '';
  var W=280,H=46,min=Math.min(0,Math.min.apply(null,pts)),max=Math.max(0,Math.max.apply(null,pts));
  var rng=(max-min)||1;
  var step=pts.length>1?W/(pts.length-1):W;
  var d=pts.map(function(v,i){var x=i*step;var y=H-((v-min)/rng)*H;return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
  var zeroY=H-((0-min)/rng)*H;
  var last=pts[pts.length-1],col=last>=0?'var(--gr)':'var(--re)';
  return '<svg class="mr-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+zeroY.toFixed(1)+'" x2="'+W+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--bd2)" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
  '</svg>';
}
function mrHistHTML(tot,perDate){
  var settled=tot.won+tot.lost+tot.push;
  var pnlC=pnlClass(tot.profit),roiC=pnlClass(tot.roi);
  var days=perDate.length;
  return '<div class="mr-card">'+
    '<div class="mr-title">HISTÓRICO · '+days+' día'+(days===1?'':'s')+'</div>'+
    '<div class="mr-stats mr-stats-5">'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--pu)">'+tot.sel+'</div><div class="mrs-l">Total</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--gr)">'+tot.won+'</div><div class="mrs-l">Ganados</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--re)">'+tot.lost+'</div><div class="mrs-l">Perdidos</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--tx2)">'+tot.push+'</div><div class="mrs-l">Push</div></div>'+
      '<div class="mrs"><div class="mrs-v" style="color:var(--tx3)">'+tot.open+'</div><div class="mrs-l">Abiertos</div></div>'+
    '</div>'+
    '<div class="mr-pnl">'+
      '<div class="mr-pnl-item"><div class="mr-pnl-l">P&amp;L acumulado</div><div class="mr-pnl-v '+pnlC+'">'+(settled?signMoney(tot.profit):'—')+'</div></div>'+
      '<div class="mr-pnl-item"><div class="mr-pnl-l">ROI</div><div class="mr-pnl-v '+roiC+'">'+(settled?signPct(tot.roi):'—')+'</div></div>'+
    '</div>'+
    (settled?mrSparkline(perDate):'<div class="mr-note">Aún no hay picks liquidados en tu historial; los totales y la curva aparecen cuando haya resultados.</div>')+
  '</div>';
}
function mrCompHTML(today,sys,fecha){
  var userReady=(today.won+today.lost+today.push)>0;
  var sysReady=sys&&(sys.wins+sys.losses+sys.pushes)>0;
  var body;
  if(!userReady&&!sysReady){
    body='<div class="mr-note">La comparativa del '+fecha+' aparecerá cuando se liquiden los resultados del día.</div>';
  } else {
    var uroi=today.roi, sroi=(sys?sys.roi_pct||0:0);
    var diff=uroi-sroi;
    var verdict=!userReady?'Tus picks del día aún no se liquidan.':
      (diff>0.05?'Tus selecciones van <b>por delante</b> del sistema completo.':
       diff<-0.05?'Tus selecciones van <b>por detrás</b> del sistema completo.':
       'Tus selecciones van <b>a la par</b> del sistema completo.');
    body=
      '<div class="mr-comp">'+
        '<div class="mr-comp-col"><div class="mr-comp-l">TÚ</div><div class="mr-comp-v '+pnlClass(uroi)+'">'+(userReady?signPct(uroi):'—')+'</div></div>'+
        '<div class="mr-comp-vs">vs</div>'+
        '<div class="mr-comp-col"><div class="mr-comp-l">SISTEMA</div><div class="mr-comp-v '+pnlClass(sroi)+'">'+(sysReady?signPct(sroi):'—')+'</div></div>'+
      '</div>'+
      '<div class="mr-note">'+verdict+'</div>';
  }
  return '<div class="mr-card">'+
    '<div class="mr-title">COMPARATIVA · '+fecha+'</div>'+
    body+
    '<div class="mr-foot">Con pocas apuestas, la diferencia entre tu ROI y el del sistema es <b>ruido, no habilidad</b>. Necesitas decenas de picks liquidados para leer una ventaja real.</div>'+
  '</div>';
}
function mrActionsHTML(){
  return '<div class="mr-actions">'+
    '<button type="button" class="mr-btn" id="exportBtn">Exportar JSON</button>'+
    '<button type="button" class="mr-btn mr-btn-danger" id="clearBtn">Borrar historial</button>'+
  '</div>';
}
function bindReportActions(){
  var e=document.getElementById('exportBtn');if(e)e.addEventListener('click',exportTicket);
  var c=document.getElementById('clearBtn');if(c)c.addEventListener('click',clearTicket);
}
function exportTicket(){
  try{
    var data={version:'tpi:v1',exported_at:new Date().toISOString(),bankroll:getBankroll(),unit_pct:getUnitPct(),ticket:getTicket()};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='mi-ticket-sportwise.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},120);
  }catch(e){}
}
function clearTicket(){
  if(!confirm('¿Borrar todo tu historial de tickets? Esta acción no se puede deshacer.'))return;
  try{localStorage.removeItem(TPI.K.ticket);}catch(e){}
  RES_CACHE={};
  renderMyReport();
  syncSelectionUI(window._FECHA);
  updateExposure();
  refreshCalc();
}
function renderMyReport(){
  var box=document.getElementById('myReport');if(!box)return;
  var head='<div class="sh"><div class="sh-ico" style="background:var(--cyd);color:var(--cy)">'+useIco('ico-wallet')+'</div><div class="sh-title">MI REPORTE</div><div class="sh-line"></div><div class="sh-ct">TU TICKET</div></div>';
  var t=getTicket(),dates=Object.keys(t).sort();
  if(!dates.length){
    box.innerHTML=head+'<div class="mr-card mr-empty">Aún no has añadido picks a tu ticket. Toca <b>“+”</b> en cualquier tarjeta para seguir tu rendimiento personal: P&amp;L, ROI e histórico con liquidación automática.</div>';
    return;
  }
  box.innerHTML=head+'<div class="mr-card"><div class="mr-note">Liquidando tu ticket…</div></div>';
  var viewed=window._FECHA||dates[dates.length-1];
  var needed=dates.slice();
  if(needed.indexOf(viewed)<0)needed.push(viewed);
  Promise.allSettled(needed.map(fetchResultsCached)).then(function(){
    var perDate=dates.map(function(d){return settleDate(d,RES_CACHE[d]);});
    var tot={sel:0,open:0,won:0,lost:0,push:0,staked:0,profit:0};
    perDate.forEach(function(o){tot.sel+=o.sel;tot.open+=o.open;tot.won+=o.won;tot.lost+=o.lost;tot.push+=o.push;tot.staked+=o.staked;tot.profit+=o.profit;});
    tot.roi=tot.staked>0?(tot.profit/tot.staked*100):0;
    var today=settleDate(viewed,RES_CACHE[viewed]);
    var sys=(RES_CACHE[viewed]&&RES_CACHE[viewed].resumen)?RES_CACHE[viewed].resumen:null;
    box.innerHTML=head+mrTodayHTML(today,viewed)+mrHistHTML(tot,perDate)+mrCompHTML(today,sys,viewed)+mrActionsHTML();
    bindReportActions();
  });
}

    t.classList.toggle('on',now);t.setAttribute('aria-checked',now?'true':'false');
    setLite(now);
  });
}

  'Tennis':['ico-tennis','tn'],'Fútbol':['ico-soccer','gr'],'FIFA World Cup 2026':['ico-trophy','pu']};
function lrnSign(v){return v>0.1?'pos':v<-0.1?'neg':'neu';}
function barColor(p){return p>=55?'linear-gradient(90deg,#0ea5e9,#10b981)':p>=48?'linear-gradient(90deg,#7c3aed,#a78bfa)':'linear-gradient(90deg,#dc2626,#f87171)';}
function loadLearning(){
  var panel=document.getElementById('learnPanel');if(!panel)return;
  fetch('/learning-summary.json')
    .then(function(r){if(!r.ok)throw new Error('no learning');return r.json();})
    .then(function(d){

        return;
      }
      var g=d.global,rs=lrnSign(g.roi);
      var sportRows=Object.keys(d.por_deporte||{})
        .sort(function(a,b){return(d.por_deporte[b].roi)-(d.por_deporte[a].roi);})
        .map(function(k){

            '<div class="lrn-pill '+ps+'">'+(a.roi>0?'+':'')+a.roi+'%</div>'+
          '</div>';
        }).join('');
      var calibNote='';
      if(d.calibracion&&d.calibracion.length){
        var tot=d.calibracion.reduce(function(s,c){return s+c.n;},0);
        var wAvg=d.calibracion.reduce(function(s,c){return s+c.sesgo*c.n;},0)/(tot||1);
        if(Math.abs(wAvg)>=3){
          calibNote='<div class="lrn-cal">'+useIco('ico-alert',14)+'<div>'+
            (wAvg>0?'La IA <b>sobreestima ~'+wAvg.toFixed(1)+' pts</b> — el sistema ya la corrige anclándola al mercado sharp.'
                   :'La IA <b>subestima ~'+Math.abs(wAvg).toFixed(1)+' pts</b> — margen para ser un poco más agresiva.')+
          '</div></div>';
