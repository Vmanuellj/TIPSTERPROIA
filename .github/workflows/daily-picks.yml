name: Daily Picks Generator

on:
  schedule:
    # GitHub retrasa/omite crons en :00 y :30 (a veces horas). Usamos minutos "raros"
    # y varios respaldos a lo largo de la mañana. La guarda en generate_picks.py evita
    # regenerar si el día ya tiene picks, así los respaldos NO gastan búsquedas/tokens.
    - cron: '7 5 * * *'    # ~00:07 CDMX (principal)
    - cron: '19 6 * * *'   # ~01:19 CDMX (respaldo 1)
    - cron: '41 8 * * *'   # ~03:41 CDMX (respaldo 2)
    - cron: '33 13 * * *'  # ~08:33 CDMX (red de seguridad matutina)
  workflow_dispatch:         # Botón manual en GitHub para probar
    inputs:
      target_date:
        description: "Fecha a generar YYYY-MM-DD (p. ej. mañana, con juegos por venir). Vacío = hoy (uso normal)."
        required: false
        default: ""
      force:
        description: "Regenerar aunque ya existan los picks de hoy (pon 1 para forzar)."
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Check results from yesterday
        run: python scripts/check_results.py

      - name: Generate picks for today
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          FORCE: ${{ github.event.inputs.force }}
          # Odds API ya no se usa: calendario/resultados desde ESPN, cuotas via web_search de Claude.
          # Opcional: CLAUDE_MODEL y WEB_SEARCH_MAX para ajustar el modelo / nº de búsquedas.
        run: python scripts/generate_picks.py

      - name: Commit and push
        run: |
          git config user.email "leunam2900@gmail.com"
          git config user.name "Tipster Bot [Auto]"
          FECHA=$(python3 -c "from datetime import datetime,timezone,timedelta; print(datetime.now(timezone(timedelta(hours=-5))).strftime('%Y-%m-%d'))")
          FECHA_AYER=$(python3 -c "from datetime import datetime,timezone,timedelta; print((datetime.now(timezone(timedelta(hours=-5)))-timedelta(days=1)).strftime('%Y-%m-%d'))")
          # Mantener picks de los últimos 30 días (para historial)
          find . -maxdepth 1 -name "picks-*.json" -mtime +30 -delete 2>/dev/null || true
          find . -maxdepth 1 -name "results-*.json" -mtime +30 -delete 2>/dev/null || true
          git add picks-${FECHA}.json latest.json picks-data.js
          git add results-${FECHA_AYER}.json 2>/dev/null || true
          git add learning-summary.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "picks ${FECHA} + resultados ${FECHA_AYER} [auto]"
          git push
